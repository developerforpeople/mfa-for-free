name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch - no point checking a stale commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-website:
    name: Demo website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-website

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: demo-website/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The same three commands CONTRIBUTING.md asks you to run before pushing.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # RFC 6238 / 4226 / 4648 conformance vectors, replay protection, drift
      # window, recovery-code hashing. If these fail, the site no longer agrees
      # with standard authenticator apps - do not "fix" them by editing the
      # expected values.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
