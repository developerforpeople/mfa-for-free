name: nlr_authenticator
description: >-
  NLR Authenticator - an educational TOTP authenticator for the NLR Identity
  project. Generates one-time codes entirely offline from a secret held in
  encrypted local storage.
publish_to: "none"

# versionName+versionCode. Bump the build number on every store upload.
version: 0.3.0+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # --- Enrollment -----------------------------------------------------------
  # mobile_scanner wraps MLKit (Android) and AVFoundation (iOS) for QR reading.
  #
  # The brief also listed `qr_code_scanner`. It is not here on purpose: that
  # package was discontinued by its author and its Android embedding breaks on
  # current Gradle and Flutter versions. mobile_scanner is its maintained
  # successor and is what the community moved to.
  mobile_scanner: ^7.1.4

  # --- Storage --------------------------------------------------------------
  # Keychain (iOS) / EncryptedSharedPreferences backed by the Android Keystore.
  # Holds ONE thing: the AES key. See services/encryption_service.dart.
  flutter_secure_storage: ^9.2.4

  # Holds the identity records, whose secrets are already ciphertext by the time
  # they arrive here. Never receives a plaintext secret.
  shared_preferences: ^2.5.3

  # --- Cryptography ---------------------------------------------------------
  # AES-GCM for secrets at rest.
  encrypt: ^5.0.3

  # HMAC-SHA1/256/512 for the TOTP engine, and a CSPRNG for key generation.
  crypto: ^3.0.6

  # --- State and navigation -------------------------------------------------
  provider: ^6.1.5+1
  go_router: ^14.8.1

  # --- Misc -----------------------------------------------------------------
  # Reads the version string for the settings screen, so the number shown to a
  # user always matches the build rather than a constant someone forgot to bump.
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
